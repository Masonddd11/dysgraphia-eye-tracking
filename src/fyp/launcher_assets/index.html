<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FYP Launcher</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --text: #0a0a0a;
    --muted: #737373;
    --border: #e5e5e5;
    --soft: #f5f5f5;
    --black: #171717;
    --white: #ffffff;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; }
  .page { max-width: 980px; min-height: 100vh; margin: 0 auto; padding: 34px 24px 28px; display: flex; flex-direction: column; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 22px; }
  .brand h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.3px; }
  .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
  .status { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 6px 10px; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #a3a3a3; }
  .status.running .dot { background: var(--black); animation: pulse 1.1s infinite; }
  .status.done .dot { background: var(--black); }
  .status.error .dot { background: #525252; }
  @keyframes pulse { 50% { opacity: .35; } }
  .layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(290px, .75fr); gap: 14px; align-items: start; }
  .stack { display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 1px 2px rgba(0,0,0,.035); padding: 18px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .card-head h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .02em; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; background: var(--soft); border: 1px solid var(--border); border-radius: 6px; padding: 3px; margin-bottom: 14px; }
  .tab { border: 0; border-radius: 4px; background: transparent; color: var(--muted); padding: 7px 8px; font-size: 12px; font-weight: 500; cursor: pointer; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--border); }
  .btn { width: 100%; border: 1px solid transparent; border-radius: 6px; padding: 9px 12px; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: background .15s ease, border-color .15s ease, color .15s ease; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--black); color: var(--white); }
  .btn-primary:hover:not(:disabled) { background: #2d2d2d; }
  .btn-outline { background: var(--card); color: var(--text); border-color: var(--border); }
  .btn-outline:hover:not(:disabled) { background: var(--soft); }
  .btn-outline:disabled { opacity: 1; color: #a3a3a3; background: var(--soft); border-color: var(--border); }
  .actions { display: grid; gap: 8px; }
  .calib-line { display: flex; align-items: center; gap: 7px; margin-top: 12px; color: var(--muted); font-size: 11px; }
  .calib-line .dot { width: 5px; height: 5px; background: #a3a3a3; }
  .calib-line .dot.ok { background: var(--black); }
  .error { display: none; margin-top: 12px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--soft); color: var(--text); font-size: 11.5px; }
  .error.show { display: block; }
  .log-card { min-height: 170px; }
  .log-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .log-head h2 { margin: 0; font-size: 12px; font-weight: 600; }
  .linkbtn { border: 0; background: none; color: var(--muted); font-size: 11px; cursor: pointer; padding: 2px 0; text-decoration: underline; text-underline-offset: 3px; }
  .linkbtn:hover { color: var(--text); }
  .log { margin: 0; height: 148px; overflow: auto; background: #fcfcfc; border: 1px solid var(--border); border-radius: 6px; padding: 10px; color: #404040; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .field { display: block; margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 500; }
  .field input, .field select { width: 100%; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); padding: 7px 9px; font-size: 12px; outline: none; }
  .field input:focus, .field select:focus { border-color: #a3a3a3; box-shadow: 0 0 0 3px rgba(0,0,0,.05); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check { display: flex; align-items: center; gap: 7px; margin-top: 2px; color: var(--muted); font-size: 11px; cursor: pointer; }
  .check input { width: 13px; height: 13px; margin: 0; accent-color: var(--black); }
  .foot { display: flex; justify-content: flex-end; margin-top: auto; padding-top: 16px; }
  .foot .linkbtn { font-size: 11px; }
  @media (max-width: 780px) {
    .layout { grid-template-columns: 1fr; }
    .topbar { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <h1>FYP Launcher</h1>
      <p>Eye-tracking copy task</p>
    </div>
    <div id="statusPill" class="status"><span class="dot"></span><span id="statusText">Ready</span></div>
  </header>

  <main class="layout">
    <div class="stack">
      <section class="card">
        <div class="card-head"><h2>Session</h2></div>
        <div class="tabs" role="tablist">
          <button id="modeWebcam" class="tab active" type="button">Webcam</button>
          <button id="modeGazepoint" class="tab" type="button">Gazepoint</button>
        </div>
        <div class="actions">
          <button id="calibrateBtn" class="btn btn-primary" type="button">Calibrate</button>
          <button id="startBtn" class="btn btn-outline" type="button">Start reading</button>
          <button id="stopBtn" class="btn btn-outline" type="button" hidden>Stop</button>
        </div>
        <div id="calibLine" class="calib-line"><span id="calibDot" class="dot"></span><span id="calibText">No calibration</span></div>
        <div id="errorBox" class="error"></div>
      </section>

      <section class="card log-card">
        <div class="log-head"><h2>Output</h2><button id="refreshBtn" class="linkbtn" type="button">Refresh</button></div>
        <pre id="log" class="log">No session yet.</pre>
      </section>
    </div>

    <div class="stack">
      <section class="card">
        <div class="card-head"><h2>Passage</h2></div>
        <label class="field"><span>File</span><input id="stimulus" type="text" list="stimulusList" value="sample_paragraph.txt" autocomplete="off"><datalist id="stimulusList"></datalist></label>
        <div class="two">
          <label class="field"><span>Font</span><input id="fontScale" type="number" min="0" max="4" step="0.1" value="0"></label>
          <label class="field"><span>Line spacing</span><input id="lineSpacing" type="number" min="1" max="4" step="0.1" value="2.2"></label>
        </div>
        <label class="field"><span>Word margin</span><input id="wordMargin" type="number" min="0" max="200" step="1" value="0"></label>
        <label class="check"><input id="rowLock" type="checkbox" checked><span>Row lock</span></label>
      </section>

      <section id="gazepointCard" class="card" hidden>
        <div class="card-head"><h2>Gazepoint</h2></div>
        <label class="field"><span>Host</span><input id="host" type="text" value="127.0.0.1" autocomplete="off"></label>
      </section>
    </div>
  </main>

  <footer class="foot"><button id="quitBtn" class="linkbtn" type="button">Quit</button></footer>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const state = { mode: "webcam", config: null, status: null, lastLog: "" };

  const api = async (path, options = {}) => {
    const res = await fetch(path, { cache: "no-store", ...options });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  };

  const showError = (message) => {
    const box = $("errorBox");
    box.textContent = message || "";
    box.classList.toggle("show", Boolean(message));
  };

  const calibrationExists = () => Boolean(state.status?.calibration_exists || state.config?.calibration_exists);

  const updateButtons = () => {
    const running = Boolean(state.status?.running);
    $("calibrateBtn").disabled = running;
    $("startBtn").disabled = running || (state.mode === "webcam" && !calibrationExists());
    $("stopBtn").hidden = !running;
    $("stopBtn").disabled = !running;
    $("modeWebcam").disabled = running;
    $("modeGazepoint").disabled = running;
  };

  const setMode = (mode) => {
    state.mode = mode;
    $("modeWebcam").classList.toggle("active", mode === "webcam");
    $("modeGazepoint").classList.toggle("active", mode === "gazepoint");
    $("gazepointCard").hidden = mode === "webcam";
    $("host").disabled = mode === "webcam";
    $("calibLine").hidden = mode === "gazepoint";
    updateButtons();
  };

  const renderStatus = (status) => {
    state.status = status;
    const pill = $("statusPill");
    pill.classList.remove("running", "done", "error");
    if (status.running) {
      pill.classList.add("running");
      $("statusText").textContent = "Running";
    } else if (status.returncode === 0) {
      pill.classList.add("done");
      $("statusText").textContent = "Finished";
    } else if (status.returncode !== null && status.returncode !== undefined) {
      pill.classList.add("error");
      $("statusText").textContent = "Error";
    } else {
      $("statusText").textContent = "Ready";
    }
    const ok = Boolean(status.calibration_exists);
    $("calibDot").classList.toggle("ok", ok);
    $("calibText").textContent = ok ? "Calibrated" : "No calibration";
    const log = (status.log || []).join("\n");
    if (log !== state.lastLog) {
      state.lastLog = log;
      $("log").textContent = log || "No session yet.";
      $("log").scrollTop = $("log").scrollHeight;
    }
    updateButtons();
  };

  const refresh = async () => {
    try { renderStatus(await api("/api/status")); showError(""); }
    catch (err) { showError(`Connection lost: ${err.message}`); }
  };

  const loadConfig = async () => {
    try {
      const cfg = await api("/api/config");
      state.config = cfg;
      const list = $("stimulusList");
      list.innerHTML = "";
      (cfg.stimulus_files || []).forEach((name) => {
        const option = document.createElement("option");
        option.value = name;
        list.appendChild(option);
      });
      if (!$("stimulus").value && cfg.default_stimulus) $("stimulus").value = cfg.default_stimulus;
      $("fontScale").value = cfg.defaults?.font_scale ?? 0;
      $("lineSpacing").value = cfg.defaults?.line_spacing ?? 2.2;
      $("wordMargin").value = cfg.defaults?.word_margin ?? 0;
      $("rowLock").checked = cfg.defaults?.row_lock ?? true;
      $("host").value = cfg.defaults?.host ?? "127.0.0.1";
    } catch (err) {
      showError(`Could not load settings: ${err.message}`);
    }
  };

  const payload = () => ({
    stimulus: $("stimulus").value.trim() || "sample_paragraph.txt",
    font_scale: Number($("fontScale").value || 0),
    line_spacing: Number($("lineSpacing").value || 2.2),
    word_margin: Number($("wordMargin").value || 0),
    row_lock: $("rowLock").checked,
    host: $("host").value.trim() || "127.0.0.1",
  });

  const start = async (kind) => {
    showError("");
    if (kind === "read" && state.mode === "webcam" && !calibrationExists()) {
      showError("Calibrate first.");
      return;
    }
    try {
      await api("/api/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: `${state.mode}_${kind}`, ...payload() }),
      });
      await refresh();
    } catch (err) { showError(err.message); }
  };

  $("calibrateBtn").addEventListener("click", () => start("calibrate"));
  $("startBtn").addEventListener("click", () => start("read"));
  $("stopBtn").addEventListener("click", async () => {
    try { await api("/api/stop", { method: "POST", body: "{}" }); await refresh(); }
    catch (err) { showError(err.message); }
  });
  $("refreshBtn").addEventListener("click", refresh);
  $("modeWebcam").addEventListener("click", () => setMode("webcam"));
  $("modeGazepoint").addEventListener("click", () => setMode("gazepoint"));
  $("quitBtn").addEventListener("click", async () => {
    if (!confirm("Quit the launcher?")) return;
    try { await api("/api/shutdown", { method: "POST", body: "{}" }); } catch (_) {}
    document.body.innerHTML = '<main style="display:grid;place-items:center;height:100vh;font-family:system-ui;background:#fafafa;color:#0a0a0a"><div style="text-align:center"><h1 style="font-size:20px;font-weight:600;margin:0">Launcher stopped</h1><p style="color:#737373;font-size:13px">You can close this tab.</p></div></main>';
  });

  setMode("webcam");
  loadConfig().then(refresh);
  setInterval(refresh, 900);
})();
</script>
</body>
</html>
