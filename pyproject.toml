[project]
name = "fyp"
version = "0.1.0"
description = "Oculomotor biomarkers for objective dysgraphia screening: eye-tracking copy-task rig"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe>=0.10.14,<0.10.15",
    "numpy>=1.26,<2",
    "pylsl>=1.16.2",
]

[project.scripts]
fyp = "fyp.cli:main"
fyp-webcam = "fyp.webcam.cli:main"
fyp-gazepoint = "fyp.gazepoint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fyp"]

[dependency-groups]
dev = ["pytest>=8"]
